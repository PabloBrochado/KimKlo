<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paleta de colores — KimKlo</title>
<style>
  @page { size: A4; margin: 0; }

  :root { --ink: #2b2420; --muted: #7a6e66; --line: #d9cfc6; --accent: #c8794a; --paper: #fffdf9; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ece7e1; color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif; }

  .toolbar { position: sticky; top: 0; z-index: 1; display: flex; gap: 12px; justify-content: center;
    padding: 12px; background: var(--ink); }
  .toolbar span { color: #e9dfd6; align-self: center; font-size: 13px; }
  .toolbar button { font: inherit; padding: 8px 16px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer; }

  .sheet { width: 210mm; height: 297mm; margin: 16px auto; padding: 14mm 14mm 10mm;
    background: var(--paper); box-shadow: 0 2px 12px rgba(0,0,0,.15);
    display: flex; flex-direction: column; gap: 5mm; }

  header { display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 2px solid var(--accent); padding-bottom: 3mm; }
  header h1 { margin: 0; font-size: 22pt; }
  header .brand { font-size: 9pt; color: var(--muted); text-align: right; }

  h2 { font-size: 10pt; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent);
    margin: 0 0 2mm; outline: none; }

  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3mm; }
  .swatch { display: flex; flex-direction: column; gap: 1mm; font-size: 8pt; }
  .chip { height: 17mm; border: 1.5px dashed var(--line); border-radius: 2mm; cursor: pointer; position: relative; }
  .chip.filled { border-style: solid; }
  .chip input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .txt { border-bottom: 1px solid var(--line); min-height: 4.6mm; outline: none; white-space: nowrap; overflow: hidden; }
  .txt.name { font-weight: 600; font-size: 8.5pt; }
  .txt::before { color: var(--muted); font-weight: 400; margin-right: 1mm; }
  .txt.hex::before { content: "HEX"; }
  .txt.rgb::before { content: "RGB"; }

  footer { margin-top: auto; display: flex; justify-content: space-between; font-size: 8pt;
    color: var(--muted); border-top: 1px solid var(--line); padding-top: 2mm; }

  @media print {
    html, body { background: none; }
    .toolbar { display: none; }
    .sheet { margin: 0; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span>Clic en un recuadro para elegir color, o escribe el HEX</span>
    <button onclick="window.print()">Imprimir / PDF</button>
  </div>

  <main class="sheet">
    <header>
      <h1>Paleta de colores</h1>
      <div class="brand">Kim &amp; Klóe · KimKlo<br>kimklo.com</div>
    </header>
    <div id="groups"></div>
    <footer><span>© Kim &amp; Klóe — KimKlo</span><span>Hoja de paleta</span></footer>
  </main>

<script>
  // Grupos de la hoja: cambia los títulos aquí o directamente en la página
  const GROUPS = ['Marca', 'Kim', 'Klóe', 'Mimí', 'Fondos y neutros'];
  const PER_GROUP = 6;

  const root = document.getElementById('groups');
  root.style.cssText = 'display:flex;flex-direction:column;gap:5mm';

  const toRgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(', ');

  for (const title of GROUPS) {
    const sec = document.createElement('section');
    sec.innerHTML = `<h2 contenteditable="true">${title}</h2><div class="grid"></div>`;
    for (let i = 0; i < PER_GROUP; i++) {
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.innerHTML = `
        <div class="chip"><input type="color" value="#ffffff"></div>
        <div class="txt name" contenteditable="true"></div>
        <div class="txt hex" contenteditable="true"></div>
        <div class="txt rgb"></div>`;
      const chip = sw.querySelector('.chip'), input = sw.querySelector('input');
      const hex = sw.querySelector('.hex'), rgb = sw.querySelector('.rgb');
      const apply = value => {
        chip.style.background = value;
        chip.classList.add('filled');
        input.value = value;
        rgb.textContent = toRgb(value);
      };
      input.addEventListener('input', () => { apply(input.value); hex.textContent = input.value.toUpperCase(); });
      hex.addEventListener('input', () => {
        let v = hex.textContent.trim().replace(/^#?/, '#');
        if (/^#[0-9a-f]{3}$/i.test(v)) v = '#' + [...v.slice(1)].map(c => c + c).join('');
        if (/^#[0-9a-f]{6}$/i.test(v)) apply(v.toLowerCase());
      });
      sec.querySelector('.grid').appendChild(sw);
    }
    root.appendChild(sec);
  }
</script>
</body>
</html>
