<!-- KimKlo · botón «+» de la cabecera (juegos y staff)
     En Elementor: abre la cabecera, arrastra un widget «HTML» dentro del contenedor de la derecha
     (kk-header__right), entre los idiomas (EN ES PT) y el botón «Sigue la historia», y pega todo esto.
     Los textos cambian solos según el idioma de la página (EN / ES / PT). -->
<div class="kk-more">
  <button type="button" class="kk-more__btn" aria-expanded="false" aria-controls="kk-more-menu">
    <span class="kk-more__plus" aria-hidden="true"></span>
  </button>
  <div class="kk-more__menu" id="kk-more-menu" hidden>
    <a class="kk-more__item" href="/play/" data-k="kids"></a>
    <a class="kk-more__item" href="/play/puzzle.html" data-k="puzzle"></a>
    <a class="kk-more__item" href="/employees/" data-k="staff"></a>
  </div>
</div>
<style>
#kk .kk-more{position:relative;display:flex;align-items:center}
#kk .kk-more__btn{width:36px;height:36px;padding:0;margin:0;display:grid;place-items:center;cursor:pointer;
  border:1.5px solid var(--ink,#0e0d10);border-radius:50%;background:transparent;color:var(--ink,#0e0d10);
  transition:background .2s,color .2s}
#kk .kk-more__btn:hover,#kk .kk-more__btn[aria-expanded="true"]{background:var(--ink,#0e0d10);color:var(--cream,#f4eee3)}
#kk .kk-more__plus{position:relative;width:14px;height:14px;transition:transform .25s}
#kk .kk-more__plus::before,#kk .kk-more__plus::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;
  background:currentColor;border-radius:1px;transform:translate(-50%,-50%)}
#kk .kk-more__plus::after{transform:translate(-50%,-50%) rotate(90deg)}
#kk .kk-more__btn[aria-expanded="true"] .kk-more__plus{transform:rotate(45deg)}
#kk .kk-more__menu{position:absolute;right:0;top:calc(100% + 10px);z-index:1000;width:min(270px,calc(100vw - 32px));
  display:flex;flex-direction:column;padding:6px;background:var(--paper,#fbf8f2);border:1.5px solid var(--ink,#0e0d10);
  border-radius:12px;box-shadow:0 12px 30px rgba(14,13,16,.14)}
#kk .kk-more__menu[hidden]{display:none}
#kk .kk-more__item{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink,#0e0d10);
  font-family:var(--font-body,'Manrope Variable',system-ui,sans-serif);line-height:1.3}
#kk .kk-more__item:hover,#kk .kk-more__item:focus-visible{background:var(--cream,#f4eee3)}
#kk .kk-more__item b{display:block;font-size:.95rem;font-weight:700}
#kk .kk-more__item small{display:block;margin-top:2px;font-size:.78rem;color:var(--muted-on-paper,#6d655d)}
#kk .kk-more__item + .kk-more__item{border-top:1px solid var(--bone,#e8e0d2)}
@media (prefers-reduced-motion:reduce){#kk .kk-more__plus{transition:none}}
</style>
<script>
(function () {
  var box = document.currentScript && document.currentScript.parentNode.querySelector('.kk-more');
  if (!box || box.dataset.ready) return;
  box.dataset.ready = '1';
  var btn = box.querySelector('.kk-more__btn'), menu = box.querySelector('.kk-more__menu');

  var lang = (document.documentElement.lang || 'en').slice(0, 2).toLowerCase();
  var T = {
    en: { label: 'More: games and staff', kids: ['Games for little ones', 'Look after Kim & Klóe · under 6'],
          puzzle: ['Puzzle', 'Kim or Klóe · 4, 6 or 9 pieces'], staff: ['Staff & Relax Space', 'Meet the team and play'] },
    es: { label: 'Más: juegos y staff', kids: ['Juegos para peques', 'Cuida a Kim y Klóe · menos de 6 años'],
          puzzle: ['Rompecabezas', 'Kim o Klóe · 4, 6 o 9 piezas'], staff: ['Staff & Relax Space', 'Conoce a la plantilla y juega'] },
    pt: { label: 'Mais: jogos e staff', kids: ['Jogos para os pequenos', 'Cuide da Kim e da Klóe · menos de 6 anos'],
          puzzle: ['Quebra-cabeça', 'Kim ou Klóe · 4, 6 ou 9 peças'], staff: ['Staff & Relax Space', 'Conheça a equipa e jogue'] }
  }[lang] || null;
  T = T || { label: 'More: games and staff', kids: ['Games for little ones', 'Look after Kim & Klóe · under 6'],
             puzzle: ['Puzzle', 'Kim or Klóe · 4, 6 or 9 pieces'], staff: ['Staff & Relax Space', 'Meet the team and play'] };

  btn.setAttribute('aria-label', T.label);
  menu.querySelectorAll('[data-k]').forEach(function (a) {
    var t = T[a.getAttribute('data-k')];
    a.innerHTML = '<b></b><small></small>';
    a.firstChild.textContent = t[0]; a.lastChild.textContent = t[1];
  });

  function open(v) {
    menu.hidden = !v;
    btn.setAttribute('aria-expanded', v ? 'true' : 'false');
  }
  btn.addEventListener('click', function (e) { e.stopPropagation(); open(menu.hidden); if (!menu.hidden) menu.querySelector('a').focus(); });
  document.addEventListener('click', function (e) { if (!box.contains(e.target)) open(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) { open(false); btn.focus(); } });
})();
</script>
